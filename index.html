<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Calculator</title>
<style>
body{font-family:Arial;background:#ecfdf5;padding:25px}
main{max-width:450px;margin:40px auto;background:white;padding:30px;border-radius:16px}
input{width:100%;padding:12px;margin:10px 0;box-sizing:border-box;border:1px solid #a7f3d0;border-radius:8px}
button{width:100%;background:#059669;color:white;padding:14px;border:0;border-radius:8px;cursor:pointer}
#result{background:#d1fae5;padding:20px;margin-top:20px;border-radius:8px;font-size:25px;text-align:center}
</style>
</head>
<body>
<main>
<h1>Currency Calculator</h1>
<p>Convert currency using your own exchange rate.</p>
<label>Amount</label>
<input id="amount" type="number" min="0" placeholder="Enter amount">
<label>Exchange Rate</label>
<input id="rate" type="number" min="0" step="any" placeholder="Enter exchange rate">
<button onclick="calculate()">Convert Currency</button>
<div id="result">Result: --</div>
<p>Exchange rates must be entered manually.</p>
</main>
<script>
function calculate(){
 const amount=document.getElementById("amount");
 const rate=document.getElementById("rate");
 const result=document.getElementById("result");
 if(amount.value===""||rate.value===""||Number(amount.value)<0||Number(rate.value)<=0){
  result.textContent="Enter valid values.";
  return;
 }
 result.textContent="Result: "+(Number(amount.value)*Number(rate.value)).toFixed(2);
}
</script>
</body>
</html>
